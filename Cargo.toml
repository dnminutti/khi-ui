[package]
name = "khi-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
rfd = "0.17.2"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "flac"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
wreq = { version = "0.16", features = ["cookies", "form"] }
wreq-util = "0.2"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
tokio = { version = "1", features = ["macros", "rt"] }
